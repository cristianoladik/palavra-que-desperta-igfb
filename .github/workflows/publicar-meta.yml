name: Palavra Que Desperta - Coordenador Meta

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: palavra-que-desperta-publicacao-meta
  cancel-in-progress: false

permissions:
  # O robo grava o resultado da publicacao de volta na fila, entao precisa escrever.
  # Usamos a chave temporaria da propria execucao, que expira ao fim do job.
  contents: write

jobs:
  publicar:
    # Duas travas independentes no nível do job: desativado não consome runner.
    if: ${{ vars.PQD_AUTOMACAO_ATIVA == 'true' && vars.PQD_PUBLICACAO_CONFIRMADA == 'true' }}
    environment: palavra-que-desperta-publicacao-meta
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar explicitamente a branch main sem credencial persistida
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar Python fixado
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências exatas
        run: "python -m pip install --require-hashes --only-binary=:all: --requirement requirements.txt"

      - name: Executar testes sem acesso externo
        run: python -m unittest discover -s tests -v

      - name: Preflight, política, publicação e limpeza coordenados
        env:
          PQD_AUTOMACAO_ATIVA: ${{ vars.PQD_AUTOMACAO_ATIVA }}
          PQD_PUBLICACAO_CONFIRMADA: ${{ vars.PQD_PUBLICACAO_CONFIRMADA }}
          PQD_PERSISTENCIA_GITHUB: ${{ vars.PQD_PERSISTENCIA_GITHUB || 'false' }}
          PQD_META_GRAPH_VERSION: ${{ vars.PQD_META_GRAPH_VERSION || 'v26.0' }}
          PQD_RELEASE_TAG: ${{ vars.PQD_RELEASE_TAG || 'fila-instagram-facebook' }}
          PQD_IG_ACCESS_TOKEN: ${{ secrets.PQD_IG_ACCESS_TOKEN }}
          PQD_IG_BUSINESS_ID: ${{ secrets.PQD_IG_BUSINESS_ID }}
          PQD_FB_PAGE_ACCESS_TOKEN: ${{ secrets.PQD_FB_PAGE_ACCESS_TOKEN }}
          PQD_FB_PAGE_ID: ${{ secrets.PQD_FB_PAGE_ID }}
          PQD_GITHUB_CONTENTS_TOKEN: ${{ secrets.PQD_GITHUB_CONTENTS_TOKEN || secrets.GITHUB_TOKEN }}
          PQD_GITHUB_BRANCH: main
          PQD_GITHUB_VISIBILIDADE_ATUAL: ${{ github.event.repository.visibility }}
          PQD_MEDIA_CACHE_DIR: ${{ runner.temp }}/palavra-que-desperta-meta
          PQD_MAX_REELS_POR_EXECUCAO: "10"
        run: python coordenar.py
